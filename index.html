<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハイパラフラグチェッカー</title>
  <style>
    html { background: #111; color: #fff; font-family: sans-serif; }
    .loading { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0.6; }
  </style>
</head>

<body>
  <div id="app"><p class="loading">読み込み中…</p></div>
  <!-- core.js / machine.js を更新したら ?v= の数字を上げる（ブラウザに残った古いファイルを読ませないため） -->
  <script type="module">
    import { importCore } from './core.js?v=2';
    import machine from './machine.js?v=1';

    const app = document.getElementById('app');
    try {
      const { mountChecker } = await importCore('checker.js');
      await mountChecker(app, machine);
    } catch (error) {
      app.textContent = '読み込みに失敗しました。時間をおいて再読み込みしてください。';
      throw error;
    }
  </script>
</body>

</html>
