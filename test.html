<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テスト実行中</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    .pass { color: #1b7f3b; }
    .fail { color: #c62828; }
    td, th { border: 1px solid #ccc; padding: 2px 6px; font-family: monospace; font-size: 12px; text-align: left; }
  </style>
</head>

<body>
  <h1>判定結果の照合テスト</h1>
  <p>全状態の判定結果を <code>test/golden.json</code>（移行前の版で記録した正解データ）と照合します。</p>
  <p id="summary">実行中…</p>
  <table id="failures"></table>
  <script type="module">
    import { importCore } from './core.js';
    import machine from './machine.js';

    const { runGolden } = await importCore('testing.js');
    const { validateMachine } = await importCore('validate.js');
    const golden = await (await fetch('./test/golden.json', { cache: 'no-store' })).json();

    const { errors, warnings } = validateMachine(machine);
    const result = runGolden(machine, golden);
    const ok = errors.length === 0 && result.failures.length === 0 && result.missing.length === 0
      && result.total === result.goldenTotal;

    const summary = document.getElementById('summary');
    summary.className = ok ? 'pass' : 'fail';
    summary.textContent = `${ok ? 'PASS' : 'FAIL'}: ${result.total} 状態中 ${result.failures.length} 件不一致`
      + ` / 正解データ ${result.goldenTotal} 件 / 定義エラー ${errors.length} 件 / 警告 ${warnings.length} 件`;
    document.title = ok ? 'PASS' : 'FAIL';

    const rows = [
      ...errors.map((message) => ['定義エラー', message, '']),
      ...result.failures.map(({ key, expected, actual }) => [key, expected, actual]),
    ];
    if (rows.length > 0) {
      document.getElementById('failures').innerHTML = '<tr><th>状態</th><th>期待値</th><th>実際</th></tr>'
        + rows.map((cells) => `<tr>${cells.map((cell) => `<td>${String(cell).replace(/</g, '&lt;')}</td>`).join('')}</tr>`).join('');
    }
    window.__testResult = { ok, errors, warnings, ...result };
  </script>
</body>

</html>
